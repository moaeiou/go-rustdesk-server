# Listen on IPv4 and IPv6. Use "0.0.0.0" for IPv4 only.
bind = "::"

# RustDesk ID-server port. Related compatibility ports retain RustDesk's
# standard offsets: -2, -1, +1, +2 and +3.
base_port = 21116

# Leave empty to make clients reuse the ID-server host for relay connections.
relay_server = ""

# Relative paths are resolved from this TOML file's directory.
data_dir = "."
log_path = "rdks.log"
log_level = "info"
log_color = true

max_connections = 4096
max_frame_size = 16777216
