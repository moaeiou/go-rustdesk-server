name: I've had enough of it, enough of it

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.nickname }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: "GOAMD64=v4"
            nickname: "linux-glibc-amd64v4"
          - tag: "GOAMD64=v3"
            nickname: "linux-glibc-amd64v3"
          - tag: "GOAMD64=v2"
            nickname: "linux-glibc-amd64v2"
          - tag: "GOAMD64=v1"
            nickname: "linux-glibc-amd64v1"
          - tag: ""
            nickname: "linux-glibc-amd64"
          - tag: "CGO_ENABLED=0"
            nickname: "linux-musl-amd64"
          - tag: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v9.2"
            nickname: "linux-musl-arm64v9.2"
          - tag: "CGO_ENABLED=0 GOARCH=arm64 GOARM64=v8.0"
            nickname: "linux-musl-arm64v8"
          - tag: "CGO_ENABLED=0 GOARCH=arm64"
            nickname: "linux-musl-arm64"
          - tag: "GOOS=darwin GOARCH=arm64"
            nickname: "darwin-arm64"
          - tag: "GOOS=windows GOARCH=amd64"
            nickname: "windows-amd64.exe"

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fuck cache
        shell: bash
        run: |
          mv go.mod go.mod.backup

      - name: Set up Go
        uses: actions/setup-go@main
        with:
          go-version: 'stable'

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(grep 'const Version' command/version.go | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build binary
        shell: bash
        run: |
          mv go.mod.backup go.mod
          ${{ matrix.tag }} go build -o go-rustdesk-server-${{ matrix.nickname }}

      - name: Release
        uses: softprops/action-gh-release@master
        with:
          tag_name: V${{ steps.get_version.outputs.version }}
          files: go-rustdesk-server-${{ matrix.nickname }}
          body: |
            # 📝 Release Notes
            - Fixes and improvements
            # ⚠️ BROKEN CHANGES
            - 这次重写了底层逻辑和目录结构并将依赖和Go版本升级到最新，请注意备份和测试。
            - 如果您装有旧版本，请卸载旧版本后再安装新版本，避免出现冲突。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
